version: '3.8'

services:
  # Manga-OCR Service
  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    ports:
      - "8001:8001"
    volumes:
      - ./data/uploads:/data/uploads:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0

  # LibreTranslate Service (alternative MTL)
  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5000:5000"
    volumes:
      - libretranslate_data:/home/libretranslate/.local/share/libretranslate
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=ja,id,en  # Load only Japanese, Indonesian, English

volumes:
  ollama_data:
  libretranslate_data:
